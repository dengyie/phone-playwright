[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-playwright"
version = "0.1.0"
description = "A Playwright-style AI-native interaction and semantic distillation framework for mobile devices"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Phone-Playwright Authors" }
]
keywords = [
    "playwright",
    "mobile",
    "android",
    "ios",
    "mcp",
    "ai-agent",
    "accessibility",
    "automation",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
vision = [
    "rapidocr-onnxruntime>=1.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
]

[project.scripts]
phone-playwright-mcp = "phone_playwright.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_playwright"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
